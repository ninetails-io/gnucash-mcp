[project]
name = "gnucash-mcp"
version = "1.3.0"
description = "MCP server for GnuCash accounting data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stephen", email = "stephen@ninetails.io" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "piecash>=1.2.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Repository = "https://github.com/ninetails-io/gnucash-mcp"

[project.scripts]
gnucash-mcp = "gnucash_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnucash_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "yfinance>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enabled checks:
#   E, W  — pycodestyle errors / warnings
#   F     — pyflakes (unused imports, undefined names)
#   I     — isort (import ordering)
#   UP    — pyupgrade (prefer modern syntax for target-version)
#   B     — bugbear (likely-bug idioms)
select = ["E", "F", "W", "I", "UP", "B"]

# Intentional suppressions:
#   E501 — line length handled by black; some long strings and URL
#          comments are legitimate and not worth reflowing.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests liberally reuse fixture names as pytest parameters — that's
# how pytest dependency-injection works, not a "redefinition" bug.
"tests/**" = ["F811"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[project]
name = "gnucash-mcp"
version = "1.4.4"
description = "MCP server for GnuCash accounting data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stephen", email = "stephen@ninetails.io" }
]
dependencies = [
    # <2: mcp 2.0.0 moved/removed mcp.server.fastmcp, and the
    # strict-kwargs patch reaches into 1.x FastMCP internals.
    "mcp[cli]>=1.0.0,<2",
    "piecash>=1.2.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Repository = "https://github.com/ninetails-io/gnucash-mcp"

[project.scripts]
gnucash-mcp = "gnucash_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnucash_mcp"]

[project.optional-dependencies]
# Driver for GNUCASH_BOOK_URI / --book-uri against PostgreSQL.
# Optional because the file backend — still the default, and what
# every bundle install uses — needs nothing beyond piecash. The
# -binary build ships wheels for every supported Python, so
# installing it never asks the user for a compiler.
postgres = [
    "psycopg2-binary>=2.9.9",
]
# Driver for MySQL / MariaDB books (GNUCASH_BOOK_URI=mysql+pymysql://...).
# PyMySQL is pure Python, so it too installs without a compiler.
mysql = [
    "pymysql>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "yfinance>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Parallel by default (pytest-xdist): the suite is tmp_path-isolated
# and proved parallel-safe; ~3x wall-clock. Pass -n0 for serial runs
# (pdb debugging, single-test timing).
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enabled checks:
#   E, W  — pycodestyle errors / warnings
#   F     — pyflakes (unused imports, undefined names)
#   I     — isort (import ordering)
#   UP    — pyupgrade (prefer modern syntax for target-version)
#   B     — bugbear (likely-bug idioms)
select = ["E", "F", "W", "I", "UP", "B"]

# Intentional suppressions:
#   E501 — line length handled by black; some long strings and URL
#          comments are legitimate and not worth reflowing.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests liberally reuse fixture names as pytest parameters — that's
# how pytest dependency-injection works, not a "redefinition" bug.
"tests/**" = ["F811"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# cryptography (transitive: mcp -> pyjwt[crypto]) stopped shipping
# macOS x86_64 wheels at 49.0; from there an Intel Mac must compile it
# from source, which needs a Rust toolchain newer than Homebrew can
# bottle for Intel macOS 26. 48.0.1 is the last release with a
# universal2 wheel. Scoped by marker so every other platform stays on
# the current release. Nothing here exercises the pinned code paths
# (X.509 / PKCS#7 parsing) — cryptography is present only for mcp's
# HTTP-auth mode, which a stdio server never enters. Drop this
# constraint when Intel macOS leaves support.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
